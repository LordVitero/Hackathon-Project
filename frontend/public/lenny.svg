  <title id="lenny-title">Lenny the dragon</title>
  <desc id="lenny-desc">A friendly green dragon waves with one arm raised. Lenny has three cream horns, brown eyes, small yellow wings, a pale segmented belly, a curled tail, and spiral markings on his feet. Vector artwork based on the supplied Lenny references. Transparent background.</desc>
